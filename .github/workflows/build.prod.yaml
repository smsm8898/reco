name: "[PROD] Build & Push Image - reco"

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.prod.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate image tag
        run: |
          # 태그 push면 그 태그를, 아니면 KST 타임스탬프를 이미지 태그로 (grip-reco 규칙)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMAGE_TAG="v$(TZ=Asia/Seoul date '+%y.%m.%d.%H%M')"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Generated image: ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
