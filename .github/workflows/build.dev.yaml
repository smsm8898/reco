name: "[DEV] Build Docker Image - reco-api"

# 이 repo는 배포 인프라가 없는 학습용이라 CI를 비활성화해 둔다 —
# self-hosted 러너·ECR·Slack 토큰이 없어 실행하면 반드시 실패한다.
# 파이프라인 설계(dev/prod 분리·태그 규칙·prune)는 참고용으로 남긴다.
# 되살릴 때: 아래 push 트리거를 복구하고 job의 `if: false`를 제거.
on:
  # push:
  #   branches:
  #     - "develop"
  #   paths:
  #     - "app/**"
  #     - "Dockerfile"
  #     - ".dockerignore"
  #     - "pyproject.toml"
  #     - "uv.lock"
  #     - ".github/workflows/build.dev.yaml"
  workflow_dispatch:

jobs:
  build:
    if: false # 비활성 — 수동 dispatch로도 실행되지 않는다
    runs-on: [self-hosted, my-dev]
    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: dev위치.dkr.ecr.ap-northeast-2.amazonaws.com
      ECR_REPO_NAMESPACE: dev위치
      ECR_REPO_NAME: reco
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag and ECR repository
        env:
          RAW_MSG: ${{ github.event.head_commit.message }}
        run: |
          IMAGE_TAG="latest"
          ECR_REPOSITORY="$ECR_REGISTRY/$ECR_REPO_NAMESPACE/$ECR_REPO_NAME"
          COMMIT_MSG=$(printf '%s' "$RAW_MSG" | head -1 | jq -Rs '.[:-1]' | sed 's/^"//;s/"$//')

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"
          echo "Generated image: $ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build the Docker image
        run: docker build --platform linux/amd64 --tag "$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the Docker image to ECR
        run: docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      # ECR 저장소에 최근(imagePushedAt 기준) 이미지 KEEP_LAST 개만 남기고 정리.
      - name: Prune old ECR images
        env:
          KEEP_LAST: 3
          # 정리에서 제외(영구 보존)할 이미지 태그 — 공백 구분.
          PROTECTED_TAGS: ""
        run: |
          REPO="$ECR_REPO_NAMESPACE/$ECR_REPO_NAME"
          FILTER="imageTags != \`null\`"
          for tag in $PROTECTED_TAGS; do
            bare="${tag#v}"
            FILTER="$FILTER && !contains(not_null(imageTags, \`[]\`), '$bare') && !contains(not_null(imageTags, \`[]\`), 'v$bare')"
          done

          # 태그된 이미지를 imagePushedAt 오름차순(오래된→최신)으로 정렬한 digest 목록.
          DIGESTS=$(aws ecr describe-images \
            --repository-name "$REPO" \
            --region "$AWS_REGION" \
            --query "sort_by(imageDetails[?$FILTER], &imagePushedAt)[*].imageDigest" \
            --output text | tr '\t' '\n' | grep . || true)

          TOTAL=$(printf '%s\n' "$DIGESTS" | grep -c . || true)
          DELETE_COUNT=$((TOTAL - KEEP_LAST))

          # Pass 1: 오래된 태그된 index 삭제(최신 KEEP_LAST + 보호태그 유지).
          if [ "$DELETE_COUNT" -gt 0 ]; then
            DIGESTS_TO_DELETE=$(printf '%s\n' "$DIGESTS" | head -n "$DELETE_COUNT")
            echo "Pass 1: pruning $DELETE_COUNT old tagged image(s) from $REPO (keeping latest $KEEP_LAST + tags: $PROTECTED_TAGS)"
            printf '%s\n' "$DIGESTS_TO_DELETE" | sed 's/^/imageDigest=/' \
              | xargs -n 100 aws ecr batch-delete-image \
                  --repository-name "$REPO" \
                  --region "$AWS_REGION" \
                  --image-ids
          else
            echo "Pass 1: nothing to prune (tagged image count $TOTAL <= $KEEP_LAST)."
          fi

          # Pass 2: Pass 1 로 참조가 끊긴 고아 untagged manifest 정리.
          ORPHANS=$(aws ecr list-images \
            --repository-name "$REPO" \
            --region "$AWS_REGION" \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*].imageDigest' \
            --output text | tr '\t' '\n' | grep . || true)

          if [ -n "$ORPHANS" ]; then
            ORPHAN_COUNT=$(printf '%s\n' "$ORPHANS" | grep -c .)
            echo "Pass 2: sweeping $ORPHAN_COUNT untagged manifest(s) (referenced children are skipped safely)"
            printf '%s\n' "$ORPHANS" | sed 's/^/imageDigest=/' \
              | xargs -n 100 aws ecr batch-delete-image \
                  --repository-name "$REPO" \
                  --region "$AWS_REGION" \
                  --image-ids
          else
            echo "Pass 2: no untagged manifests."
          fi

      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ""
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} ${{ job.status == 'success' && ':white_check_mark:'  || ':boom:' }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#36a64f'  || '#e01e5a' }}",
                  "blocks": [
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Image:*\n${{ env.ECR_REPO_NAMESPACE }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n${{ env.COMMIT_MSG }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "emoji": true,
                            "text": "View log in Github"
                          },
                          "style": "primary",
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
