[project]
name = "reco"
version = "0.1.0"
description = "커머스 플랫폼을 위한 추천 시스템"
requires-python = ">=3.13"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "fastapi>=0.139.2",
    "prometheus-fastapi-instrumentator>=7.1",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "implicit>=0.7.3",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "scipy>=1.18.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
