services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reco
      POSTGRES_PASSWORD: reco
      POSTGRES_DB: reco
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reco -d reco"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
